name: Terraform validation

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-validate.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-validate.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test zero-funding Lambda
        run: python -m unittest discover -s tests -v
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - infra/bootstrap
          - infra/environments/demo
          - infra/environments/nonprod
          - infra/environments/production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - name: Build demo Lambda package
        if: matrix.root == 'infra/environments/demo'
        shell: pwsh
        run: ./scripts/build-demo-package.ps1
      - name: Initialise without remote backend
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false
      - name: Validate
        working-directory: ${{ matrix.root }}
        run: terraform validate
