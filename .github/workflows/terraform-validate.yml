name: Terraform validation

on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Test zero-funding Lambda
        run: python -m unittest discover -s tests -v
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - infra/bootstrap
          - infra/environments/demo
          - infra/environments/nonprod
          - infra/environments/production
          - infra/github-release-role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - name: Build demo Lambda package
        if: matrix.root == 'infra/environments/demo'
        shell: pwsh
        run: ./scripts/build-demo-package.ps1
      - name: Initialise without remote backend
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false
      - name: Validate
        working-directory: ${{ matrix.root }}
        run: terraform validate
