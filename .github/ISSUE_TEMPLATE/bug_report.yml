name: Bug report
description: Report a reproducible defect without including sensitive data.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, customer information or exploit details. Use private vulnerability reporting for security issues."
  - type: textarea
    id: outcome
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction steps
      description: Use synthetic data only.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or release
      placeholder: Commit SHA or local branch
  - type: textarea
    id: checks
    attributes:
      label: Validation output
      description: Include relevant test output with secrets removed.
